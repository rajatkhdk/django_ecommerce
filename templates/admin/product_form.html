{% extends 'admin/base.html' %} {% load static %} {% block content %}
<div class="content-wrapper">
  <div class="content-header">
    <div class="container-fluid">
      <h1 class="mb-4">
        {% if form.instance.pk %}Edit{% else %}Add{% endif %} Product
      </h1>
    </div>
  </div>
  <section class="content">
    <div class="container-fluid">
      <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <!-- Name -->
        <div class="form-group">
          <label for="{{ form.name.id_for_label }}">Name</label>
          {{ form.name }}
        </div>

        <!-- Slug -->
        <div class="form-group">
          <label for="{{ form.slug.id_for_label }}">Slug</label>
          {{ form.slug }}
        </div>

        <!-- Price -->
        <div class="form-group">
          <label for="{{ form.price.id_for_label }}">Price</label>
          {{ form.price }}
        </div>

        <!-- Category -->
        <div class="form-group">
          <label for="{{ form.category.id_for_label }}">Category</label>
          {{ form.category }}
        </div>

        <!-- Available Checkbox -->
        <div class="form-check mb-3">
          {{ form.is_available }}
          <label
            class="form-check-label"
            for="{{ form.is_available.id_for_label }}"
          >
            Available
          </label>
        </div>

        <!-- Image Upload -->
        <div class="form-group">
          <label>Product Image</label>
         <div class="d-flex gap-2 align-items-center">
         <!-- Hidden file input for local choose -->
<input type="file" id="file-input" name="image" style="display:none;">
    <!-- Local Choose -->
    <button type="button" class="btn btn-outline-primary" onclick="document.getElementById('file-input').click()">Choose File</button>

    <!-- Browse from File Manager -->
    <button type="button" class="btn btn-outline-secondary" onclick="openFileManager()">Browse</button>
    
    <!-- Hidden input for selected file path from file manager -->
    <input type="hidden" id="image_path" name="image_path" value="{% if form.instance.image %}{{ form.instance.image.name }}{% endif %}">
  </div>
  
  <!-- Preview -->
  <img id="image_preview" src="{% if form.instance.image %}{{ form.instance.image.url }}{% endif %}" 
       alt="Image Preview" style="margin-top:10px; max-height:150px; display: {% if form.instance.image %}block{% else %}none{% endif %};">
</div>

        <!-- Description -->
        <div class="form-group">
          <label for="{{ form.description.id_for_label }}">Description</label>
          {{ form.description }}
        </div>

        <!-- Buttons -->
        <button type="submit" class="btn btn-success">Save</button>
        <a href="{% url 'product_list' %}" class="btn btn-secondary">Cancel</a>
      </form>
    </div>
  </section>
</div>
<script>
function openFileManager() {
    window.open(
      "/admin/filemanager/1/folder/products/?picker=1",
      "FileManager",
      "width=900,height=600"
    );
}

// Called by file manager after selecting a file
function setSelectedFile(filePath, fileUrl) {
  console.log("Browse selected:", filePath, fileUrl);
    document.getElementById("image_path").value = filePath;

    const preview = document.getElementById("image_preview");
    preview.src = fileUrl;
    preview.style.display = "block";
}

// Update preview when local file is chosen
document.getElementById('file-input').addEventListener('change', function(event) {
    const file = event.target.files[0];
    if(file){
        const reader = new FileReader();
        reader.onload = function(e){
            const preview = document.getElementById("image_preview");
            preview.src = e.target.result;
            preview.style.display = "block";
        }
        reader.readAsDataURL(file);

        // clear filemanager path
        document.getElementById("image_path").value = "";
    }
});
</script>
{% endblock %}
